tui:
  vimMode: true
composer:
  shape: band
  tokenRate: false
setupVersion: 3
update:
  auto: true
symbolPreset: ascii
statusLine:
  separator: ascii
  preset: custom
  leftSegments:
    - vim
    - model
    - mode
    - path
    - git
    - pr
  rightSegments:
    - status
    - session_name
    - token_total
    - cost
    - context_pct
  showHookStatus: false
theme:
  dark: seoul256-darkest
  light: seoul256-darkest
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  smol: anthropic/claude-haiku-5-5:medium
  optmem: anthropic/claude-haiku-5-5:medium
defaultThinkingLevel: medium
dev:
  autoqaConsent: granted